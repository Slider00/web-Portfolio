<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 68" fill="none">
  <defs>
    <!-- Fuselage Metallic Gradient -->
    <linearGradient id="hullTop" x1="35" y1="12" x2="155" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="hullBottom" x1="35" y1="34" x2="150" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- Astronaut Suit Solar Orange Accent -->
    <linearGradient id="solarWing" x1="55" y1="10" x2="125" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff9a62" />
      <stop offset="50%" stop-color="#ff7a3d" />
      <stop offset="100%" stop-color="#d94e1f" />
    </linearGradient>
    <!-- Cockpit Visor Gradient -->
    <linearGradient id="visorGlass" x1="96" y1="22" x2="136" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06091f" />
      <stop offset="65%" stop-color="#16213e" />
      <stop offset="100%" stop-color="#33c2cc" />
    </linearGradient>
    <!-- Plasma Afterburner -->
    <linearGradient id="thrusterFlame" x1="42" y1="34" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#7ce8ff" />
      <stop offset="62%" stop-color="#ff7a3d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ff7a3d" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer Thruster Plasma Plume -->
  <path
    d="M42 27.5L4 34L42 40.5Z"
    fill="url(#thrusterFlame)"
  />
  <!-- Inner White-Hot Core Flame -->
  <path
    d="M43 30.5L18 34L43 37.5Z"
    fill="#ffffff"
  />

  <!-- Upper Far Stabilizer Fin -->
  <path
    d="M52 24L38 9H56L78 24Z"
    fill="#cbd5e1"
    stroke="#06091f"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <path
    d="M44 13H54L64 21H52Z"
    fill="url(#solarWing)"
  />

  <!-- Lower Swept Delta Wing -->
  <path
    d="M58 41L42 59H66L98 42Z"
    fill="url(#hullBottom)"
    stroke="#06091f"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <!-- Orange Squadron Wing Stripe -->
  <path
    d="M51 55L62 43H74L60 55Z"
    fill="url(#solarWing)"
  />

  <!-- Dual Ion Engine Nozzles -->
  <rect
    x="38"
    y="26.5"
    width="11"
    height="6.5"
    rx="1.5"
    fill="#1e293b"
    stroke="#06091f"
    stroke-width="2"
  />
  <rect
    x="38"
    y="35"
    width="11"
    height="6.5"
    rx="1.5"
    fill="#1e293b"
    stroke="#06091f"
    stroke-width="2"
  />
  <!-- Glowing Nozzle Rings -->
  <line x1="38.5" y1="28" x2="38.5" y2="31.5" stroke="#7ce8ff" stroke-width="2" stroke-linecap="round" />
  <line x1="38.5" y1="36.5" x2="38.5" y2="40" stroke="#7ce8ff" stroke-width="2" stroke-linecap="round" />

  <!-- Main Aerodynamic Starfighter Fuselage (Top Hull) -->
  <path
    d="M46 25C68 21 104 20 136 26L174 34L134 37H46Z"
    fill="url(#hullTop)"
    stroke="#06091f"
    stroke-width="2.4"
    stroke-linejoin="round"
  />

  <!-- Main Fuselage Belly (Cel-Shaded Shadow Hull) -->
  <path
    d="M46 35H134L174 34L132 43C102 45 68 44 46 41Z"
    fill="url(#hullBottom)"
    stroke="#06091f"
    stroke-width="2.4"
    stroke-linejoin="round"
  />

  <!-- Nose Cone & Fuselage Solar Orange Accent Trim -->
  <path
    d="M138 27.5L167 33.6L138 35.5L143 31.5Z"
    fill="url(#solarWing)"
  />
  <path
    d="M62 25.5H84L79 34H58Z"
    fill="url(#solarWing)"
  />

  <!-- Armored Cockpit Canopy -->
  <path
    d="M94 25.5C106 21.5 123 22.5 135 28.5L128 33.5H92Z"
    fill="url(#visorGlass)"
    stroke="#06091f"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <!-- Canopy Specular Glint -->
  <path
    d="M101 26C109 24 119 24.6 126 27.5"
    stroke="#ffffff"
    stroke-width="1.6"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Foreground Side Winglet Pod -->
  <path
    d="M72 36L60 48H82L104 37Z"
    fill="#e2e8f0"
    stroke="#06091f"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <line x1="66" y1="45" x2="80" y2="45" stroke="#ff7a3d" stroke-width="2.2" stroke-linecap="round" />
</svg>

