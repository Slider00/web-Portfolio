<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/web-Portfolio/vite.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="oLXH-Do5IlApXKtuieDCaWl9MNuxDg1P-SFwEd5TrHs" />
    <title>Portfolio</title>
    <style>
      /* Critical inline CSS to prevent FOUC & show loading screen immediately */
      .initial-loader-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #030412;
        z-index: 9999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .loader-spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(255, 255, 255, 0.03);
        border-top-color: #33c2cc;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 15px rgba(51, 194, 204, 0.15);
        margin-bottom: 20px;
      }
      .loader-text {
        color: #888888;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
    <script type="module" crossorigin src="/web-Portfolio/assets/index-BmAW6IG9.js"></script>
    <link rel="stylesheet" crossorigin href="/web-Portfolio/assets/index-D5PiZAla.css">
  </head>
  <body>
    <div id="root">
      <div class="initial-loader-container">
        <div class="loader-spinner"></div>
        <div class="loader-text">Cargando Portafolio</div>
      </div>
    </div>
  </body>
</html>
